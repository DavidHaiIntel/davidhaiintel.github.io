<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ניהול שאלות | IOC</title>
<link rel="icon" href="logo.png" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>
<div class="page">
  <header class="header">
    <div class="brand">
      <img src="logo.png" alt="IOC" class="logo" />
    </div>
    <h1>ניהול שאלות</h1>
  </header>

  <main class="content">
    <section class="card" id="login-card">
      <h2>כניסת מנהל</h2>
      <form id="login-form">
        <label for="password">סיסמה</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
        <button type="submit" id="login-btn">כניסה</button>
        <p class="form-message" id="login-message" role="status"></p>
      </form>
    </section>

    <section class="card" id="admin-card" hidden>
      <div class="list-header">
        <h2>כל השאלות</h2>
        <div class="list-controls">
          <button class="refresh-btn" id="admin-refresh-btn" title="רענון">⟳</button>
          <button class="sort-btn" id="logout-btn">יציאה</button>
        </div>
      </div>
      <ul class="questions" id="admin-list">
        <li class="empty-state">טוען...</li>
      </ul>
    </section>
  </main>

  <footer class="footer">
    <a href="index.html">חזרה לעמוד השאלות</a>
  </footer>
</div>

<script src="js/admin.js"></script>
</body>
</html>
