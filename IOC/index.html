<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>שו"ת פתוח | סדרת הרצאות כלכלת משפחה - IOC</title>
<link rel="icon" href="logo.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="page">
  <header class="header">
    <div class="brand">
      <img src="logo.png" alt="IOC - Israel Observant Community" class="logo" />
      <img src="intel-logo.jpg" alt="Intel" class="logo logo-intel" onerror="this.style.display='none'" />
    </div>
    <h1>שו"ת פתוח</h1>
    <p class="subtitle">סדרת הרצאות כלכלת משפחה &middot; רשמו שם ושאלה, ואנחנו נענה עליה ביום ההרצאה</p>
  </header>

  <main class="content">
    <section class="card form-card">
      <h2>שאילת שאלה</h2>
      <form id="question-form" novalidate>
        <label for="name">שם</label>
        <input type="text" id="name" name="name" maxlength="80" required placeholder="השם שלך" autocomplete="name" />

        <label for="question">השאלה שלך</label>
        <textarea id="question" name="question" maxlength="1000" rows="4" required placeholder="מה תרצו לשאול?"></textarea>

        <!-- honeypot field, hidden from real users via CSS -->
        <div class="honeypot" aria-hidden="true">
          <label for="website">website</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off" />
        </div>

        <button type="submit" id="submit-btn">שליחת שאלה</button>
        <p class="form-message" id="form-message" role="status"></p>
      </form>
    </section>

    <section class="card list-card">
      <div class="list-header">
        <h2>השאלות שנשלחו</h2>
        <div class="list-controls">
          <button class="sort-btn active" data-sort="new">חדשות</button>
          <button class="sort-btn" data-sort="top">פופולריות</button>
          <button class="refresh-btn" id="refresh-btn" title="רענון">⟳</button>
        </div>
      </div>
      <ul class="questions" id="questions-list">
        <li class="empty-state">טוען שאלות...</li>
      </ul>
    </section>
  </main>

  <footer class="footer">
    <a href="admin.html">כניסת מנהל</a>
  </footer>
</div>

<script src="js/main.js"></script>
</body>
</html>
